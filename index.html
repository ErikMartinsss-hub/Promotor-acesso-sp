<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcessPromo - Controle de Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0f171e; gap: 12px; }
      .dbg-msg { color: #5a6a78; font-size: 12px; font-family: sans-serif; }
      .dbg-err { color: #e74c3c; font-size: 14px; font-family: sans-serif; }
    </style>
    <script>
      window.__debug = function(msg) {
        var el = document.getElementById('dbg');
        if (el) el.textContent = msg;
      };
      window.__error = function(msg) {
        var el = document.getElementById('err');
        if (el) el.textContent = 'ERRO: ' + msg;
      };
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading" id="loading">
        <p style="color:#8197a4;font-weight:bold;font-family:sans-serif">Carregando...</p>
        <p id="dbg" class="dbg-msg"></p>
        <p id="err" class="dbg-err"></p>
      </div>
    </div>
    <script>
      window.__debug('1. Inline sync OK')
    </script>
    <script type="module">
      window.__debug('2. Inline module OK')
    </script>
  </body>
</html>
